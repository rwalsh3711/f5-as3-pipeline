---
- name: Send email with as3_output_file as attachment
  delegate_to: localhost
  block:
    - name: Send email with AS3 declaration attached
      ansible.builtin.mail:
        host: "testsmtp.example.com"
        port: "25"
        subject: "AS3 Declaration for {{ inventory_hostname }}"
        to: "{{ email | default('user@example.com') }}"
        from: "user@example.com"
        attach: "{{ as3_output_file }}"
        body: "Attached is the AS3 declaration file for {{ inventory_hostname }} generated by the Ansible AS3 pipeline."